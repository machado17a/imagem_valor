<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extrator de Matérias</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      width: 380px;
      min-height: 200px;
    }

    header {
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header .logo {
      font-size: 20px;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.02em;
    }

    header span.sub {
      display: block;
      font-size: 10px;
      color: #666;
      font-weight: 400;
      margin-top: 1px;
    }

    .content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #statusBar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: #aaa;
      min-height: 40px;
    }

    #statusBar.ok    { border-color: #1a4a2e; color: #4ade80; }
    #statusBar.error { border-color: #4a1a1a; color: #f87171; }
    #statusBar.warn  { border-color: #4a3a1a; color: #fbbf24; }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.green  { background: #4ade80; }
    .dot.red    { background: #f87171; }
    .dot.orange { background: #fbbf24; }
    .dot.blue   { background: #60a5fa; }
    .dot.gray   { background: #555; }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid #333;
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #metaBox {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    .meta-row {
      font-size: 11px;
      color: #999;
      display: flex;
      gap: 6px;
    }
    .meta-row .label {
      color: #555;
      min-width: 70px;
      flex-shrink: 0;
    }
    .meta-row .value {
      color: #ccc;
      word-break: break-word;
    }

    #previewBox {
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    #previewLabel {
      font-size: 11px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    #previewText {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 12px;
      font-size: 11px;
      color: #bbb;
      line-height: 1.6;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    button:not(:disabled):hover { opacity: 0.85; }

    #btnExtract {
      background: #25d366;
      color: #000;
    }

    #btnCopy {
      background: #1d4ed8;
      color: #fff;
      display: none;
    }

    #btnCopy.copied {
      background: #065f46;
    }
  </style>
</head>
<body>
  <header>
    <span class="logo">📰</span>
    <h1>Extrator de Matérias <span class="sub">Formatação para WhatsApp</span></h1>
  </header>

  <div class="content">
    <div id="statusBar">
      <span class="dot gray"></span>
      <span>Pronto para extrair</span>
    </div>

    <div id="metaBox">
      <div class="meta-row"><span class="label">Título</span><span class="value" id="mTitle">—</span></div>
      <div class="meta-row"><span class="label">Subtítulo</span><span class="value" id="mExcerpt">—</span></div>
      <div class="meta-row"><span class="label">Autor</span><span class="value" id="mAuthor">—</span></div>
      <div class="meta-row"><span class="label">Data</span><span class="value" id="mDate">—</span></div>
      <div class="meta-row"><span class="label">Veículo</span><span class="value" id="mSite">—</span></div>
    </div>

    <div id="previewBox">
      <span id="previewLabel">Pré-visualização</span>
      <div id="previewText"></div>
    </div>

    <div class="btn-row">
      <button id="btnExtract">Extrair matéria</button>
      <button id="btnCopy" id="btnCopy">Copiar para WhatsApp</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
